# ============================================
# Nginx Reverse Proxy Configuration
# ============================================
# Routes:
#   /api/*        → chat-backend:5000  (Node.js REST API)
#   /socket.io/*  → chat-backend:5000  (WebSocket upgrade)
#   /*            → chat-frontend:80   (React static files)

upstream backend {
    server chat-backend:5000;
}

upstream frontend {
    server chat-frontend:80;
}

server {
    listen 80;
    server_name localhost;

    # ---- API requests ----
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket (Socket.io) ----
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for real-time events
        proxy_buffering    off;
        proxy_cache        off;

        # Timeout settings for long-lived connections
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    # ---- Frontend (React SPA) ----
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
